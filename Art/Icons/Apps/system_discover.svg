<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD55" stop-opacity="1" />
      <stop offset="60%" stop-color="#FF8800" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF4400" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00EEFF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
  </defs>
  <!-- Background circle subtle -->
  <circle cx="32" cy="32" r="30" fill="#0c121e" stroke="#1a3350" stroke-width="2" />
  <!-- Astrometric crosshairs / grid -->
  <line x1="32" y1="4" x2="32" y2="60" stroke="#1d426d" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="4" y1="32" x2="60" y2="32" stroke="#1d426d" stroke-width="1" stroke-dasharray="2 2" />
  <!-- Orbital ellipses -->
  <ellipse cx="32" cy="32" rx="14" ry="10" fill="none" stroke="#246499" stroke-width="1.2" transform="rotate(-20 32 32)" />
  <ellipse cx="32" cy="32" rx="24" ry="16" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="4 2" transform="rotate(-20 32 32)" />
  <!-- Central Star -->
  <circle cx="32" cy="32" r="10" fill="url(#starGlow)" />
  <circle cx="32" cy="32" r="4.5" fill="#FFFFAA" />
  <!-- Orbiting Planets -->
  <circle cx="43" cy="27" r="3" fill="#00FFCC" stroke="#FFFFFF" stroke-width="0.8" />
  <circle cx="16" cy="39" r="4" fill="#3399FF" stroke="#FFFFFF" stroke-width="0.8" />
  <!-- Space Station icon dot -->
  <polygon points="48,18 51,23 45,23" fill="#FFCC00" stroke="#FFFFFF" stroke-width="0.5" />
  <!-- Volumetric Height Indicator / Vector line -->
  <line x1="16" y1="39" x2="16" y2="47" stroke="#FF5588" stroke-width="1.5" />
  <circle cx="16" cy="47" r="1.5" fill="#FF5588" />
</svg>
